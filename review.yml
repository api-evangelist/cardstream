harvest:
  openapiHarvested: false
  specsCount: 0
  reason: |
    Cardstream publishes no OpenAPI/Swagger definition. The gateway is a
    form-post (application/x-www-form-urlencoded) API documented in prose on
    GitBook. Candidate spec URLs (/openapi.json, /swagger.json on both the gateway
    and api hosts) returned 404 or did not resolve. Saving a spec would require
    fabrication, so none was written.
