threeds2_simulation:
  system: 3-D Secure Product Integration Testing (PIT)
  frictionless_status_by_expiry_month:
    - {month: "01", status: Y, meaning: Fully authenticated}
    - {month: "02", status: N, meaning: Not authenticated}
    - {month: "03", status: U, meaning: Unknown authentication status}
    - {month: "04", status: A, meaning: Attempted authentication}
    - {month: "05", status: D, meaning: Decoupled authentication}
    - {month: "06", status: R, meaning: Transaction rejected}
    - {month: "07", status: E, meaning: Unknown error performing 3DS checks}
    - {month: "08", status: E, meaning: Error - Directory Server timeout}
    - {month: "09", status: E, meaning: Error - corrupt Directory Server response}
    - {month: "10", status: I, meaning: Information only}
    - {month: "11", status: U, meaning: Cardholder not enrolled (error 13)}
    - {month: "12", status: C, meaning: Frictionless not possible - challenge cardholder}
  note: Expiry month 12 simulates the challenge (non-frictionless) flow.
