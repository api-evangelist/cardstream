generated: '2026-07-24'
method: searched
source: https://guides.gitbook.io/integrationguide/references/feature-references/integration-testing
note: >-
  Cardstream test Merchant Accounts connect to a Simulator (not a live acquirer)
  and to a 3-D Secure Product Integration Testing (PIT) system. Test Merchant
  Account IDs are issued during onboarding. All values below are published
  verbatim in the integration guide's Integration Testing section and are for the
  Simulator only - test cards are rejected on production accounts (responseCode
  65566), and production cards return 66311 on test accounts.
modes:
  test: Simulator + 3DS PIT; test Merchant Account IDs issued at onboarding
  live: real acquirer + production 3DS
  separation: separate test vs live Merchant Account IDs
test_amount_triggers:
  note: >-
    On test accounts the minor-unit transaction amount selects the simulated
    authorisation and settlement outcome. Any amount outside these ranges returns
    responseCode 66311 (Invalid Test Amount).
  ranges:
    - {min_minor: 100, max_minor: 2499, auth: "0 (AUTH CODE)", settlement: ACCEPTED}
    - {min_minor: 2500, max_minor: 4999, auth: "0 (AUTH CODE)", settlement: REJECTED}
    - {min_minor: 5000, max_minor: 7499, auth: "1 CARD REFERRED then 0 AUTHCODE", settlement: ACCEPTED}
    - {min_minor: 7500, max_minor: 9999, auth: "1 CARD REFERRED then 0 AUTHCODE", settlement: REJECTED}
    - {min_minor: 10000, max_minor: 14999, auth: "5 CARD DECLINED", settlement: N/A}
    - {min_minor: 15000, max_minor: 19999, auth: "4 CARD DECLINED - KEEP CARD", settlement: N/A}
    - {min_minor: 20000, max_minor: 24999, auth: "65 SCA REQUIRED then 0 AUTH CODE", settlement: ACCEPTED}
    - {min_minor: 25000, max_minor: 29999, auth: "65 SCA REQUIRED then 5 CARD DECLINED", settlement: N/A}
  sca_soft_decline_range: "20000-29999 (eligible transactions return responseCode 65 SCA REQUIRED)"
  amount_override: >-
    Set the Cardholder Name to 'Test [N]' where N is the pounds value to trigger
    (e.g. 'Test [20]' triggers the 100-2499 minor-unit ACCEPTED range regardless
    of the submitted amount).
test_card_expiry: December of the current year (two-digit), unless simulating 3DS status via expiry month
