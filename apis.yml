name: Cardstream
kind: company
description: Cardstream is an independent United Kingdom payment gateway providing a
  white-label payment platform that banks, PSPs, ISOs, acquirers and software companies
  resell under their own brand. It connects merchants to card schemes (Visa, Mastercard),
  digital wallets and 150+ Alternative Payment Methods from a single integration, with
  PCI DSS Level 1 processing, tokenisation, recurring billing, 3-D Secure 2 authentication,
  risk and fraud checking, and dynamic currency conversion. Its developer surface is a
  mature form-post gateway API exposed through three integration methods — Hosted
  (Hosted Payment Pages and Hosted Payment Fields), Direct (server-to-server), and
  Batch — documented in a public GitBook integration guide and supported by SDKs for
  PHP, Java, Node.js, Go, Ruby, C#, iOS and Android plus e-commerce modules. Requests
  are HTTP POST with application/x-www-form-urlencoded fields authenticated by merchantID
  plus optional password, HMAC message signing and IP allow-listing; the gateway does
  not publish a downloadable OpenAPI/Swagger definition or a JSON/REST surface.
