apis:
- aid: cardstream:cardstream-gateway-hosted
  name: Cardstream Gateway - Hosted Integration
  description: Hosted Payment Pages (HPP) integration. The merchant's browser POSTs a
    URL-encoded request to the Gateway, which collects and processes the cardholder's
    payment details on a Cardstream-hosted page (lightbox, redirect or iframe) and POSTs
    the signed result back to the merchant's redirectURL. Removes cardholder data from
    the merchant's PCI scope.
  humanURL: https://guides.gitbook.io/integrationguide/getting-started/introduction-to-our-gateway/integration-methods
  baseURL: https://gateway.cardstream.com/hosted/
  tags:
  - Hosted Payment Pages
  - Card Payments
  properties:
  - type: Documentation
    url: https://guides.gitbook.io/integrationguide/
  - type: APIReference
    url: https://guides.gitbook.io/integrationguide/gateway-functionality/features/new-transactions/request-fields
- aid: cardstream:cardstream-gateway-direct
  name: Cardstream Gateway - Direct Integration
  description: Server-to-server integration. The merchant collects payment details on
    its own secure server and sends a URL-encoded HTTP POST directly to the Gateway for
    processing, supporting sales, refunds, cancellations, 3-D Secure 2, tokenisation and
    management requests. Optionally used with Hosted Payment Fields so sensitive card
    data is tokenised by the Gateway before the Direct request.
  humanURL: https://guides.gitbook.io/integrationguide/getting-started/introduction-to-our-gateway/integration-methods
  baseURL: https://gateway.cardstream.com/direct/
  tags:
  - Card Payments
  - Refunds
  - 3D Secure
  - Tokenization
  tags_raw:
  - Card Payments
  - Refunds
  - 3-D Secure
  - Tokenization
  properties:
  - type: Documentation
    url: https://guides.gitbook.io/integrationguide/
  - type: APIReference
    url: https://guides.gitbook.io/integrationguide/gateway-functionality/features/new-transactions/request-fields
  - type: Authentication
    url: https://guides.gitbook.io/integrationguide/getting-started/setting-up-your-integration/authentication
- aid: cardstream:cardstream-gateway-batch
  name: Cardstream Gateway - Batch Integration
  description: An enhancement to the Direct Integration that submits multiple transactions
    in a single multipart/mixed HTTP POST. The Gateway queues the transactions and returns
    a batch reference number used to download a status file; useful for capturing many
    transactions or collecting recurring subscription and loan-repayment charges. Does
    not support interactive flows such as 3-D Secure or wallet checkouts.
  humanURL: https://guides.gitbook.io/integrationguide/getting-started/introduction-to-our-gateway/integration-methods
  baseURL: https://gateway.cardstream.com/direct/
  tags:
  - Batch
  - Subscription
  - Recurring
  tags_raw:
  - Batch
  - Subscriptions
  - Recurring
  properties:
  - type: Documentation
    url: https://guides.gitbook.io/integrationguide/
  - type: APIReference
    url: https://guides.gitbook.io/integrationguide/getting-started/setting-up-your-integration/integration-details
- aid: cardstream:cardstream-hosted-payment-fields
  name: Cardstream Hosted Payment Fields
  description: A client-side library where only the individual input fields that collect
    sensitive cardholder data are hosted by the Gateway while the rest of the payment
    form is served by the merchant. On submission the Gateway returns a payment token
    representing the card data, which the merchant then processes via the Direct
    Integration without ever handling raw cardholder data.
  humanURL: https://guides.gitbook.io/integrationguide/references/code-references/integration-libraries/hosted-payment-fields-library
  baseURL: https://gateway.cardstream.com/hosted/
  tags:
  - Tokenization
  - Hosted Payment Pages
  properties:
  - type: Documentation
    url: https://guides.gitbook.io/integrationguide/references/code-references/integration-libraries/hosted-payment-fields-library
