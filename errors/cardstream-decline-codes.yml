retry_advice_codes:
  field: rtAdviceCode
  docs: https://guides.gitbook.io/integrationguide/references/response-and-advice-codes/retry-transaction-advice-codes
  codes:
    - {code: 0, advice: No advice code provided; retry decision is up to the merchant}
    - {code: 1, advice: Retry after updating payment method details (new expiry/CVV etc.)}
    - {code: 2, advice: Retry after rtRetryAfter timestamp (or 72 hours if not provided)}
    - {code: 3, advice: Do not retry; contact cardholder for an alternative payment method}
    - {code: 4, advice: Do not retry; recurring agreement cancelled by cardholder}
sca_soft_decline:
  code: 65
  meaning: SCA Required
  note: >-
    Soft decline requiring Strong Customer Authentication via 3-D Secure. Re-attempt
    the payment with SCA/3DS authentication. See PSD2 SCA Compliance and SCA
    Soft-Declines sections.
