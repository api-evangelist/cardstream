generated: '2026-07-24'
method: searched
source: https://guides.gitbook.io/integrationguide/references/response-and-advice-codes/response-codes/authorisation-response-codes
docs: https://guides.gitbook.io/integrationguide/references/response-and-advice-codes
note: >-
  Acquirer authorisation (decline) codes returned by the Cardstream Gateway. These
  are the ISO 8583 (1987) 2-character response codes, mapped to numeric values
  (original 2-letter code shown in parentheses where non-numeric). The code is
  returned in the responseCode field; the original acquirer code/message are
  echoed in acquirerResponseCode / acquirerResponseMessage. Retry guidance is
  returned in rtAdviceCode (+ rtRetryAfter). Complements
  errors/cardstream-problem-types.yml (Gateway 65xxx/66xxx errors).
envelope:
  response_code_field: responseCode
  response_message_field: responseMessage
  acquirer_code_field: acquirerResponseCode
  acquirer_message_field: acquirerResponseMessage
  retry_advice_field: rtAdviceCode
  retry_after_field: rtRetryAfter
approval_codes:
  - {code: 0, meaning: Successful approval/completion}
  - {code: 10, meaning: Approval for partial amount}
  - {code: 11, meaning: Approved VIP}
  - {code: 16, meaning: Approved, Update Track 3}
